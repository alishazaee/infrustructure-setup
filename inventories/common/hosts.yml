all:
  children:
    hypervisors:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          ansible_become_password: "{{ controller_become_password }}"
          # Use classic sudo because this host's sudo-rs alternative does not
          # implement Ansible's become prompt protocol reliably.
          ansible_become_exe: /usr/bin/sudo.ws
    vms:
      vars:
        ansible_connection: ssh
        ansible_user: root
        ansible_password: "{{ vm_root_password }}"
        ansible_python_interpreter: /usr/bin/python3
      hosts: {}
    nexus_machine:
      hosts: {}
