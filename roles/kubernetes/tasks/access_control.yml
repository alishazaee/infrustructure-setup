---
- name: Check for the Kubernetes operator kubeconfig
  ansible.builtin.stat:
    path: "{{ k8s_user_kubeconfig }}"
  register: k8s_user_config

- name: Generate a dedicated Kubernetes operator kubeconfig
  ansible.builtin.command:
    argv:
      - kubeadm
      - kubeconfig
      - user
      - --config
      - /etc/kubernetes/kubeadm.yml
      - --client-name
      - "{{ k8s_user }}"
      - --org
      - "{{ k8s_user_group }}"
  register: k8s_generated_user_config
  changed_when: true
  no_log: true
  when: not k8s_user_config.stat.exists

- name: Store the dedicated Kubernetes operator kubeconfig
  ansible.builtin.copy:
    content: "{{ k8s_generated_user_config.stdout }}\n"
    dest: "{{ k8s_user_kubeconfig }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not k8s_user_config.stat.exists

- name: Bind the Kubernetes operator group to its configured role
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ k8s_admin_kubeconfig }}"
      - apply
      - --filename
      - "-"
    stdin: "{{ lookup('ansible.builtin.template', 'operator-rbac.yml.j2') }}"
  register: k8s_operator_rbac
  changed_when: "'created' in k8s_operator_rbac.stdout or 'configured' in k8s_operator_rbac.stdout"
