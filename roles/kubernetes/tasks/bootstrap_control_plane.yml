---
- name: Write the kubeadm bootstrap configuration
  ansible.builtin.template:
    src: kubeadm.yml.j2
    dest: /etc/kubernetes/kubeadm.yml
    owner: root
    group: root
    mode: "0600"

- name: Check whether the bootstrap control plane exists
  ansible.builtin.stat:
    path: "{{ k8s_admin_kubeconfig }}"
  register: k8s_bootstrap_config

- name: Read the endpoint of an existing cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ k8s_admin_kubeconfig }}"
      - config
      - view
      - --minify
      - --output=jsonpath={.clusters[0].cluster.server}
  register: k8s_existing_endpoint
  changed_when: false
  when: k8s_bootstrap_config.stat.exists

- name: Refuse an in-place control-plane endpoint change
  ansible.builtin.assert:
    quiet: true
    that:
      - k8s_existing_endpoint.stdout == 'https://' ~ k8s_control_plane_endpoint
    fail_msg: >-
      The existing cluster uses a different control-plane endpoint. Recreate this
      environment with playbooks/delete-vms.yml before deploying this topology.
  when: k8s_bootstrap_config.stat.exists

- name: Pre-pull every control-plane image through Nexus
  ansible.builtin.command:
    argv:
      - kubeadm
      - config
      - images
      - pull
      - --config
      - /etc/kubernetes/kubeadm.yml
  register: k8s_control_plane_image_pull
  changed_when: "'Pulled' in k8s_control_plane_image_pull.stdout"
  when: not k8s_bootstrap_config.stat.exists

- name: Initialize the first Kubernetes control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm.yml
      - --upload-certs
  args:
    creates: "{{ k8s_admin_kubeconfig }}"
  no_log: true

- name: Verify bootstrap completion before joining other nodes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ k8s_admin_kubeconfig }}"
      - --request-timeout=10s
      - --namespace=kube-system
      - get
      - configmap/kubeadm-config
      - daemonset/kube-proxy
      - deployment/coredns
  changed_when: false
