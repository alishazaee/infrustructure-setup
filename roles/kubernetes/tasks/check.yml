---
- name: Check Kubernetes health
  environment:
    KUBECONFIG: "{{ k8s_admin_kubeconfig }}"
  block:
    - name: Wait for API server readiness
      ansible.builtin.command: kubectl get --raw=/readyz
      register: k8s_api_ready
      until: k8s_api_ready.rc == 0 and k8s_api_ready.stdout == 'ok'
      retries: 30
      delay: 5
      changed_when: false

    - name: Wait for every expected node to become Ready
      ansible.builtin.command:
        argv: "{{ ['kubectl', 'wait', '--for=condition=Ready', '--timeout=' ~ k8s_check_timeout ~ 's', 'node'] + k8s_control_plane_hosts + k8s_worker_hosts }}"
      changed_when: false

    - name: Read the configured API endpoint
      ansible.builtin.command:
        argv:
          - kubectl
          - config
          - view
          - --minify
          - --output=jsonpath={.clusters[0].cluster.server}
      register: k8s_cluster_endpoint
      changed_when: false

    - name: Require the configured API endpoint
      ansible.builtin.assert:
        quiet: true
        that:
          - k8s_cluster_endpoint.stdout == 'https://' ~ k8s_control_plane_endpoint

    - name: Verify the dedicated operator credential
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ k8s_user_kubeconfig }}"
          - auth
          - can-i
          - get
          - pods
          - --all-namespaces
      register: k8s_operator_access
      changed_when: false

    - name: Require operator authorization
      ansible.builtin.assert:
        quiet: true
        that:
          - k8s_operator_access.stdout == 'yes'

    - name: Read the cluster nodes
      ansible.builtin.command: kubectl get nodes -o json
      register: k8s_nodes
      changed_when: false

    - name: Verify the exact node membership
      ansible.builtin.assert:
        quiet: true
        that:
          - (k8s_nodes.stdout | from_json)['items'] | map(attribute='metadata.name') | sort == (k8s_control_plane_hosts + k8s_worker_hosts) | sort

    - name: Verify node roles and versions
      ansible.builtin.assert:
        quiet: true
        that:
          - ('node-role.kubernetes.io/control-plane' in item.metadata.labels) == (item.metadata.name in k8s_control_plane_hosts)
          - item.status.nodeInfo.kubeletVersion == 'v' ~ k8s_version
      loop: "{{ (k8s_nodes.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: Read replicated control-plane components
      ansible.builtin.command:
        argv:
          - kubectl
          - --namespace
          - kube-system
          - get
          - pods
          - --selector
          - "component={{ item }}"
          - --output=json
      loop:
        - kube-apiserver
        - etcd
      register: k8s_replicated_components
      changed_when: false

    - name: Require one ready API server and etcd instance per control plane
      ansible.builtin.assert:
        quiet: true
        that:
          - ((item.stdout | from_json)['items'] | length) == (k8s_control_plane_hosts | length)
          - >-
            (item.stdout | from_json)['items']
            | map(attribute='status.containerStatuses')
            | flatten
            | selectattr('ready', 'equalto', true)
            | list
            | length == (k8s_control_plane_hosts | length)
      loop: "{{ k8s_replicated_components.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Wait for CoreDNS and network components
      ansible.builtin.command: "kubectl rollout status {{ item }} --timeout={{ k8s_check_timeout }}s"
      loop:
        - deployment/coredns -n kube-system
        - daemonset/kube-proxy -n kube-system
        - daemonset/kube-flannel-ds -n kube-flannel
      changed_when: false

    - name: Create an isolated smoke-test workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: k8s-check-
      register: k8s_check_workspace
      when: k8s_worker_hosts | length > 0

    - name: Test workloads and networking on every worker
      when: k8s_worker_hosts | length > 0
      vars:
        k8s_check_namespace: "{{ k8s_check_workspace.path | basename | lower | replace('_', '-') }}"
      block:
        - name: Start the smoke-test DaemonSet and Service
          ansible.builtin.command: kubectl apply -f -
          args:
            stdin: "{{ lookup('ansible.builtin.template', 'check-workload.yml.j2') }}"
          changed_when: true

        - name: Wait for one test pod per worker
          ansible.builtin.command: "kubectl -n {{ k8s_check_namespace }} rollout status daemonset/network-check --timeout={{ k8s_check_timeout }}s"
          changed_when: false

        - name: Read the test pods
          ansible.builtin.command: "kubectl -n {{ k8s_check_namespace }} get pods -l app=network-check -o json"
          register: k8s_check_pods
          changed_when: false

        - name: Require a scheduled test pod on every worker
          ansible.builtin.assert:
            quiet: true
            that:
              - (k8s_check_pods.stdout | from_json)['items'] | map(attribute='spec.nodeName') | sort == k8s_worker_hosts | sort

        - name: Verify DNS, Service routing, and cross-node pod connectivity
          ansible.builtin.command:
            argv:
              - kubectl
              - "-n"
              - "{{ k8s_check_namespace }}"
              - exec
              - "{{ item.metadata.name }}"
              - "--"
              - sh
              - "-ec"
              - >-
                nslookup kubernetes.default.svc.cluster.local;
                wget -q -T 10 -O - http://network-check:8080;
                {% for pod in (k8s_check_pods.stdout | from_json)['items'] %}
                wget -q -T 10 -O - http://{{ pod.status.podIP }}:8080;
                {% endfor %}
          loop: "{{ (k8s_check_pods.stdout | from_json)['items'] }}"
          loop_control:
            label: "{{ item.spec.nodeName }}"
          changed_when: false
      rescue:
        - name: Show smoke-test events
          ansible.builtin.command: "kubectl -n {{ k8s_check_namespace }} get events --sort-by=.lastTimestamp"
          register: k8s_check_events
          changed_when: false
          failed_when: false
        - name: Report the failed smoke test
          ansible.builtin.fail:
            msg: "{{ k8s_check_events.stdout }}"
      always:
        - name: Remove the temporary test namespace
          ansible.builtin.command: "kubectl delete namespace {{ k8s_check_namespace }} --ignore-not-found --wait=false"
          changed_when: true
        - name: Remove the temporary test workspace
          ansible.builtin.file:
            path: "{{ k8s_check_workspace.path }}"
            state: absent

    - name: Show the verified cluster
      ansible.builtin.command: kubectl get nodes -o wide
      register: k8s_verified_nodes
      changed_when: false

    - name: Report Kubernetes health
      ansible.builtin.debug:
        msg: "{{ k8s_verified_nodes.stdout_lines }}"
