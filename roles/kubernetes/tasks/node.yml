---
- name: Gather node facts
  ansible.builtin.setup:
    gather_subset: [min, hardware]

- name: Create the Kubernetes operator account
  ansible.builtin.user:
    name: "{{ k8s_user }}"
    comment: Kubernetes operator
    create_home: true
    shell: /bin/bash
    password_lock: true
    state: present

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap on subsequent boots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
    replace: '# Disabled for Kubernetes: \1'

- name: Persist Kubernetes kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Load Kubernetes kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Configure Kubernetes packet forwarding
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - name: net.ipv4.ip_forward
      value: 1
    - name: net.bridge.bridge-nf-call-iptables
      value: 1
    - name: net.bridge.bridge-nf-call-ip6tables
      value: 1

- name: Install runtime and repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - conntrack
      - containerd
      - python3-debian
      - socat
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read the containerd version
  ansible.builtin.command: containerd --version
  register: k8s_containerd_version
  changed_when: false

- name: Create runtime and Kubernetes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/containerd
    - /etc/apt/keyrings
    - /etc/apt/auth.conf.d
    - /etc/kubernetes

- name: Install Nexus credentials for Kubernetes package downloads
  ansible.builtin.copy:
    dest: /etc/apt/auth.conf.d/nexus.conf
    content: |
      machine http://{{ nexus_hostname }}:{{ nexus_ui_port }}
      login {{ k8s_registry_username }}
      password {{ k8s_registry_password }}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create containerd registry namespaces
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ registry_mirror.namespace }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ k8s_registry_mirrors }}"
  loop_control:
    loop_var: registry_mirror
    label: "{{ registry_mirror.namespace }}"

- name: Configure containerd CRI and systemd cgroups
  ansible.builtin.template:
    src: containerd.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart Kubernetes containerd

- name: Configure authenticated Nexus pulls for containerd
  ansible.builtin.template:
    src: registry-hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ registry_mirror.namespace }}/hosts.toml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ k8s_registry_mirrors }}"
  loop_control:
    loop_var: registry_mirror
    label: "{{ registry_mirror.namespace }}"
  notify: Restart Kubernetes containerd
  no_log: true

- name: Apply runtime changes before kubeadm
  ansible.builtin.meta: flush_handlers

- name: Enable containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Download the Kubernetes repository signing key through Nexus
  ansible.builtin.get_url:
    url: "{{ k8s_nexus_kubernetes_packages_url }}/Release.key"
    url_username: "{{ k8s_registry_username }}"
    url_password: "{{ k8s_registry_password }}"
    force_basic_auth: true
    dest: /etc/apt/keyrings/kubernetes.asc
    owner: root
    group: root
    mode: "0644"
  no_log: true

- name: Configure the Nexus-backed Kubernetes package repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] {{ k8s_nexus_kubernetes_packages_url }}/ /"
    filename: kubernetes
    state: present
    update_cache: true

- name: Install pinned Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_package_version }}"
      - "kubeadm={{ k8s_package_version }}"
      - "kubectl={{ k8s_package_version }}"
    state: present

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Configure the kubelet node address
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS="--node-ip={{ ansible_host }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Kubernetes kubelet

- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true

- name: Apply kubelet configuration
  ansible.builtin.meta: flush_handlers
