---
- name: Check whether the worker has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_worker_config

- name: Join an unconfigured worker
  when: not k8s_worker_config.stat.exists
  block:
    - name: Generate a short-lived join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --ttl
          - 30m
          - --print-join-command
          - --kubeconfig
          - "{{ k8s_admin_kubeconfig }}"
      delegate_to: "{{ k8s_bootstrap_host }}"
      register: k8s_join_command
      changed_when: true
      no_log: true

    - name: Join the Kubernetes worker
      ansible.builtin.command:
        argv: >-
          {{ k8s_join_command.stdout.split()
             + ['--cri-socket', k8s_cri_socket,
                '--node-name', inventory_hostname] }}
      args:
        creates: /etc/kubernetes/kubelet.conf
      no_log: true

- name: Label the worker node
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ k8s_admin_kubeconfig }}"
      - label
      - node
      - "{{ inventory_hostname }}"
      - node-role.kubernetes.io/worker=
      - --overwrite
  delegate_to: "{{ k8s_bootstrap_host }}"
  register: k8s_worker_label
  changed_when: "'not labeled' not in k8s_worker_label.stdout"
