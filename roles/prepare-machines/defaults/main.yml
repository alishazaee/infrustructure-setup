---
machine_packages:
  - tmux
  - htop
  - sysstat
  - iotop
  - nmon
  - bmon
  - fzf
  - kubectx
  - docker.io
  - python3-docker

kns_command_path: /usr/local/bin/kns
kns_implementation_path: /usr/bin/kubens

nexus_hostname: nexus
nexus_docker_group_port: 5000
nexus_registry_url: "http://{{ nexus_hostname }}:{{ nexus_docker_group_port }}"
nexus_ui_port: 8081
nexus_admin_username: admin
nexus_url: "http://{{ nexus_hostname }}:{{ nexus_ui_port }}"
nexus_docker_connector_ports:
  - "{{ nexus_docker_group_port }}"
